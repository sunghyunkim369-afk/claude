name: coin-quant 시황 실행 (재사용)

# coin-quant-daily.yml 이 부르는 실제 실행 부분. 이 파일은 코드 브랜치에서 읽으므로 고쳐도 기본 브랜치에 다시 합칠 필요 없음.
on:
  workflow_call:

permissions:
  contents: read

env:
  CODE_REF: claude/sweet-bohr-g35f4h

jobs:
  briefing:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: coin-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coin-quant/requirements.txt
      - run: pip install -r requirements.txt
      - name: 이전 데이터·알림 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: |
            coin-quant/data_cache
            coin-quant/user_data
          key: coin-quant-light-${{ github.run_id }}
          restore-keys: coin-quant-light-
      - name: 시황 보내기
        run: python -m coinquant alert --light
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 선택: 뉴스 AI 요약
          PYTHONUTF8: "1"
          CQ_SCHEDULED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}   # 예약·외부 예약(cron-job.org) 실행은 오늘 이미 보냈으면 건너뜀
      - name: 데이터·알림 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            coin-quant/data_cache
            coin-quant/user_data
          key: coin-quant-light-${{ github.run_id }}
