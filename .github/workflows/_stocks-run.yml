name: 주식 오늘의 소식 실행 (재사용)

# stocks-daily.yml 이 부르는 실제 실행 부분. 이 파일은 코드 브랜치에서 읽으므로 고쳐도 기본 브랜치에 다시 합칠 필요 없음.
on:
  workflow_call:

permissions:
  contents: write

env:
  CODE_REF: claude/sweet-bohr-g35f4h
  PUBLISH_BRANCH: stock-briefing

jobs:
  brief:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coin-quant/requirements-stocks.txt
      - run: pip install -r coin-quant/requirements-stocks.txt
      - uses: actions/cache/restore@v4
        with:
          path: coin-quant/data_cache/stocks
          key: stocks-brief-${{ github.run_id }}
          restore-keys: |
            stocks-brief-
            stocks-data-
      - name: 오늘의 소식 만들기
        id: make
        working-directory: coin-quant
        run: |
          python -m coinquant stocks-brief ${{ github.event_name == 'push' && '--no-send' || '' }}
          if ls out/briefing/daily/*.md > /dev/null 2>&1; then echo "made=1" >> "$GITHUB_OUTPUT"; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 선택: 뉴스 AI 요약
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          CQ_SCHEDULED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}   # 예약·외부 예약(cron-job.org) 실행은 오늘 이미 보냈으면 건너뜀
      - name: 페이지 출력 (로그)
        if: steps.make.outputs.made == '1'
        run: cat coin-quant/out/briefing/daily/*.md
      - name: 페이지 올리기 (stock-briefing 브랜치)
        if: github.event_name != 'push' && steps.make.outputs.made == '1'
        run: |
          set -e
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          cd "$RUNNER_TEMP"
          if git ls-remote --exit-code --heads "$url" "$PUBLISH_BRANCH" > /dev/null; then
            git clone --depth 1 -b "$PUBLISH_BRANCH" "$url" pub
          else
            mkdir pub && cd pub && git init -b "$PUBLISH_BRANCH" && git remote add origin "$url" && cd ..
          fi
          mkdir -p pub/daily
          cp "$GITHUB_WORKSPACE"/coin-quant/out/briefing/daily/*.md pub/daily/
          cd pub
          { echo "# 주식 오늘의 소식"; echo; echo "> 투자 판단을 돕는 정보일 뿐 투자 권유가 아닙니다. 원금 손실 가능성이 있습니다."; echo;
            for f in $(ls daily | sort -r | head -200); do echo "- [${f%.md}](daily/$f)"; done; } > README.md
          git config user.name "coin-quant bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "오늘의 소식 $(date -u +%Y-%m-%d)" || echo "바뀐 것 없음"
          git push origin "$PUBLISH_BRANCH"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: coin-quant/data_cache/stocks
          key: stocks-brief-${{ github.run_id }}
