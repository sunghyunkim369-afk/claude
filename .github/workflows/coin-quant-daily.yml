name: coin-quant 매일 시황 (텔레그램)

# 매일 09:20 KST 에 BTC·ETH·SOL 시황 + 공식 신호 + 어젯밤 발표 결과 + 일정·뉴스를 텔레그램으로 보냄. PC가 꺼져 있어도 동작.
# 필요: 저장소 Settings → Secrets and variables → Actions 에 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 등록.
# 예약 실행(schedule)은 저장소 '기본 브랜치'에 이 파일이 있어야 돌아감. 수동 실행: Actions 탭 → Run workflow.
# GitHub 예약은 몇 시간씩 늦거나 빠질 때가 있어 하루 4번 걸어 둠 → 그날 처음 성공한 1번만 보내고 나머지는 건너뜀.
# 실제 실행 내용은 코드 브랜치의 _coin-run.yml (고쳐도 기본 브랜치에 다시 합칠 필요 없음).
# 업비트 키는 여기 넣지 않음 (주문 기능 없음, 조회도 안 함).
on:
  schedule:
    - cron: "20 0 * * *"   # UTC 00:20 = KST 09:20 (일봉 마감 20분 뒤)
    - cron: "50 1 * * *"   # KST 10:50 (앞 예약이 안 돌았을 때 대비)
    - cron: "20 3 * * *"   # KST 12:20
    - cron: "50 4 * * *"   # KST 13:50
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coin-quant-daily
  cancel-in-progress: false

jobs:
  run:
    if: github.server_url == 'https://github.com'
    uses: sunghyunkim369-afk/claude/.github/workflows/_coin-run.yml@claude/sweet-bohr-g35f4h
    secrets: inherit
