name: coin-quant 매일 시황 (텔레그램)

# 매일 09:20 KST 에 BTC·ETH·SOL 시황 + 공식 신호 + 일정·4년 주기·뉴스를 텔레그램으로 보냄. PC가 꺼져 있어도 동작.
# 필요: 저장소 Settings → Secrets and variables → Actions 에 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 등록.
# 예약 실행(schedule)은 저장소 '기본 브랜치'에 이 파일이 있어야 돌아감. 수동 실행: Actions 탭 → Run workflow.
# 업비트 키는 여기 넣지 않음 (주문 기능 없음, 조회도 안 함).
on:
  schedule:
    - cron: "20 0 * * *"   # UTC 00:20 = KST 09:20 (일봉 마감 20분 뒤)
  workflow_dispatch:

permissions:
  contents: read

env:
  CODE_REF: claude/sweet-bohr-g35f4h   # coin-quant 코드가 있는 브랜치 (이 파일은 예약 실행 때문에 기본 브랜치에도 둠)

concurrency:
  group: coin-quant-daily
  cancel-in-progress: false

jobs:
  briefing:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: coin-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coin-quant/requirements.txt
      - run: pip install -r requirements.txt
      - name: 이전 데이터·알림 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: |
            coin-quant/data_cache
            coin-quant/user_data
          key: coin-quant-light-${{ github.run_id }}
          restore-keys: coin-quant-light-
      - name: 시황 보내기
        run: python -m coinquant alert --light
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
      - name: 데이터·알림 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            coin-quant/data_cache
            coin-quant/user_data
          key: coin-quant-light-${{ github.run_id }}
