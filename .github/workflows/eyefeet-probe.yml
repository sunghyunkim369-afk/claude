name: Eyefeet probe

# eyefeet 서비스 자체가 열리는지, 우리 사이트만 꺼졌는지 구분하는 수동 점검
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # 같은 저장소가 GitSalt(Gitea Actions)에 복사돼도 거기서는 돌지 않게: 수집·발행·배포는 GitHub 에서만
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          for h in eyefeet.com www.eyefeet.com eyefeetai.com www.eyefeetai.com tcmvp.eyefeet.com; do
            ip=$(getent hosts "$h" | awk '{print $1}' | head -1)
            res=$(curl -s -o /dev/null -w '%{http_code} %{time_total}s' --max-time 15 "https://$h/" 2>&1)
            err=$(curl -sS -o /dev/null --max-time 15 "https://$h/" 2>&1 | head -1)
            echo "$h  IP=${ip:-없음(DNS 실패)}  응답=$res  ${err}"
          done
          # Eyefeet AI 서비스가 살아 있는지 (키 없이 보내서 응답 코드만 봐요: 401/403 = 서비스는 동작, 5xx·000 = 서비스 장애)
          for path in /api/chat/completions /api/v1/chat/completions /v1/chat/completions /api/chat /openai/chat/completions /api/models /v1/models /api/v1/models; do
            for host in https://www.eyefeetai.com https://eyefeetai.com; do
              p=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' "$host$path")
              g=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$host$path")
              allow=$(curl -s -I -X OPTIONS --max-time 20 "$host$path" | tr -d '\r' | grep -i '^allow' | head -1)
              echo "AI $host$path  POST=$p GET=$g $allow"
            done
          done
          # 우리 사이트 AI 연결 (짧은 질문 1개)
          echo "tcmvp /api/ai 응답: $(curl -s --max-time 40 -X POST -H 'Content-Type: application/json' -H 'Origin: https://tcmvp.eyefeet.com' -d '{"task":"ask","query":"관세가 뭐야?","context":"테스트"}' https://tcmvp.eyefeet.com/api/ai | head -c 200)"
          # 새 운영 주소에서 화면 경로 확인 (2026-10-17): 응답 코드와 페이지 제목만
          for path in / /tradecompass-mvp/ /mate/tradecompass-mvp/ /mate/ /hs-code-finder/ /mate/hs-code-finder/ /login /settings /api/health; do
            code=$(curl -s -L -o page.txt -w '%{http_code}' --max-time 20 "https://tradecompass.eyefeet.com$path")
            echo "tradecompass.eyefeet.com$path  $code  $(grep -o '<title>[^<]*' page.txt | head -1)"
          done
          # 운영 사이트가 화면에 쓰는 기사·언론사 숫자 (공개 데이터만, 2026-10-20)
          B=https://tradecompass.eyefeet.com
          for path in /tradecompass-mvp/data.js /api/data /api/dashboard /api/news/latest "/api/issues/top10"; do
            code=$(curl -s -L -o d.txt -w '%{http_code}' --max-time 25 "$B$path"); echo "== $path $code $(wc -c < d.txt)B"
            node -e '
              let t=require("fs").readFileSync("d.txt","utf8"); const i=t.indexOf("{"); if(i<0) process.exit(0); t=t.slice(i).replace(/;\s*$/,"");
              let d; try{d=JSON.parse(t)}catch(e){console.log("  JSON 아님:",t.slice(0,160));process.exit(0)}
              const m=d.meta||d; const pick=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>typeof v!=="object").slice(0,25));
              console.log("  ",JSON.stringify(pick(m)).slice(0,600));
              if(Array.isArray(d.issues)) console.log("   issues",d.issues.length, d.issues.slice(0,3).map(x=>x.keyword||x.title).join(" / "));
              if(Array.isArray(d)) console.log("   배열",d.length, JSON.stringify(d[0]||{}).slice(0,200));
              for (const k of Object.keys(d)) if(Array.isArray(d[k])) console.log("   배열키",k,d[k].length);
            '
          done
          # 운영 사이트가 화면에 쓰는 기사·언론사 숫자 (공개 데이터만, 2026-10-20)
          B=https://tradecompass.eyefeet.com
          for path in /tradecompass-mvp/data.js /api/data /api/dashboard /api/news/latest /api/issues/top10; do
            code=$(curl -s -L -o d.txt -w '%{http_code}' --max-time 25 "$B$path"); echo "== $path $code $(wc -c < d.txt)B"
            node -e '
              let t=require("fs").readFileSync("d.txt","utf8"); const i=t.search(/[\[{]/); if(i<0) process.exit(0); t=t.slice(i).replace(/;\s*$/,"");
              let d; try{d=JSON.parse(t)}catch(e){console.log("  JSON 아님:",t.slice(0,160).replace(/\s+/g," "));process.exit(0)}
              const m=d.meta||d; const pick=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>typeof v!=="object").slice(0,25));
              if(!Array.isArray(m)) console.log("  ",JSON.stringify(pick(m)).slice(0,600));
              if(Array.isArray(d)) console.log("   배열",d.length, JSON.stringify(d[0]||{}).slice(0,240));
              else for (const k of Object.keys(d)) if(Array.isArray(d[k])) console.log("   배열키",k,d[k].length, JSON.stringify(d[k][0]||{}).slice(0,160));
            '
          done
          # 운영 사이트 이번 주 Top 10 (이슈·점수·보도 수·대표 기사·보여 주는 기사 4개)
          curl -s --max-time 25 https://tradecompass.eyefeet.com/api/data -o top.json
          node -e '
            const d=JSON.parse(require("fs").readFileSync("top.json","utf8"));
            console.log("기간",d.meta.period,"기사",d.meta.sources,"언론사",d.meta.outlets);
            d.issues.forEach((x,i)=>{ console.log(`#${i+1} ${x.keyword} | 점수 ${x.score} | 보도 ${x.reports} | 직전 ${x.prev} | 관련도 ${x.leadRelevance} | V ${x.parts&&x.parts.volume} M ${x.parts&&x.parts.momentum} R ${x.parts&&x.parts.relevance}`);
              console.log("   대표: "+x.title+" ("+x.source+")");
              (x.articles||[]).slice(1,4).forEach(a=>console.log("   - "+a.title+" ("+a.source+")")); });
            console.log("섹터", d.sectors.map(s=>s.name+" "+s.score+" "+s.state+" "+s.articles+"건").join(" | "));
          '
