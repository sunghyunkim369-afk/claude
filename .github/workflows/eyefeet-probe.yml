name: Eyefeet probe

# eyefeet 서비스 자체가 열리는지, 우리 사이트만 꺼졌는지 구분하는 수동 점검
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # 같은 저장소가 GitSalt(Gitea Actions)에 복사돼도 거기서는 돌지 않게: 수집·발행·배포는 GitHub 에서만
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          for h in eyefeet.com www.eyefeet.com eyefeetai.com www.eyefeetai.com tcmvp.eyefeet.com; do
            ip=$(getent hosts "$h" | awk '{print $1}' | head -1)
            res=$(curl -s -o /dev/null -w '%{http_code} %{time_total}s' --max-time 15 "https://$h/" 2>&1)
            err=$(curl -sS -o /dev/null --max-time 15 "https://$h/" 2>&1 | head -1)
            echo "$h  IP=${ip:-없음(DNS 실패)}  응답=$res  ${err}"
          done
          # Eyefeet AI 서비스가 살아 있는지 (키 없이 보내서 응답 코드만 봐요: 401/403 = 서비스는 동작, 5xx·000 = 서비스 장애)
          for path in /api/chat/completions /api/v1/chat/completions /v1/chat/completions /api/chat /openai/chat/completions /api/models /v1/models /api/v1/models; do
            for host in https://www.eyefeetai.com https://eyefeetai.com; do
              p=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' "$host$path")
              g=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$host$path")
              allow=$(curl -s -I -X OPTIONS --max-time 20 "$host$path" | tr -d '\r' | grep -i '^allow' | head -1)
              echo "AI $host$path  POST=$p GET=$g $allow"
            done
          done
          # 우리 사이트 AI 연결 (짧은 질문 1개)
          echo "tcmvp /api/ai 응답: $(curl -s --max-time 40 -X POST -H 'Content-Type: application/json' -H 'Origin: https://tcmvp.eyefeet.com' -d '{"task":"ask","query":"관세가 뭐야?","context":"테스트"}' https://tcmvp.eyefeet.com/api/ai | head -c 200)"
