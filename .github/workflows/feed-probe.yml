name: News feed probe

# 뉴스 출처 후보의 RSS가 실제로 받아지는지 확인하는 수동 점검
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e +o pipefail
          check() {
            code=$(curl -sL -A "Mozilla/5.0 TradeCompassBot" -o f.xml -w '%{http_code}' --max-time 25 "$2" || echo 000)
            items=$(grep -o '<item[ >]' f.xml | wc -l); entries=$(grep -o '<entry[ >]' f.xml | wc -l)
            first=$(grep -o '<title>[^<]*</title>' f.xml | sed -n '2p' | head -c 90)
            [ -z "$first" ] && first=$(grep -o '<title><!\[CDATA\[[^]]*' f.xml | sed -n '2p' | head -c 90)
            echo "$code items=$items entries=$entries | $1 | $first"
          }
          check "yna-economy"      "https://www.yna.co.kr/rss/economy.xml"
          check "yna-industry"     "https://www.yna.co.kr/rss/industry.xml"
          check "yna-international" "https://www.yna.co.kr/rss/international.xml"
          check "korea-press-all"  "https://www.korea.kr/rss/pressrelease.xml"
          check "korea-motie"      "https://www.korea.kr/rss/dept_motie.xml"
          check "korea-kcs"        "https://www.korea.kr/rss/dept_kcs.xml"
          check "korea-moef"       "https://www.korea.kr/rss/dept_moef.xml"
          check "korea-mof"        "https://www.korea.kr/rss/dept_mof.xml"
          check "hankyung-economy" "https://www.hankyung.com/feed/economy"
          check "hankyung-intl"    "https://www.hankyung.com/feed/international"
          check "mk-economy"       "https://www.mk.co.kr/rss/30100041/"
          check "gnews-ko-tariff"  "https://news.google.com/rss/search?q=%EA%B4%80%EC%84%B8%20when%3A7d&hl=ko&gl=KR&ceid=KR%3Ako"
          check "gnews-ko-export"  "https://news.google.com/rss/search?q=%EC%88%98%EC%B6%9C%20%EA%B7%9C%EC%A0%9C%20when%3A7d&hl=ko&gl=KR&ceid=KR%3Ako"
          check "gnews-en-tariff"  "https://news.google.com/rss/search?q=tariff%20Korea%20when%3A7d&hl=en-US&gl=US&ceid=US%3Aen"
          check "wto-news"         "https://www.wto.org/library/rss/latest_news_e.xml"
          check "ustr-press"       "https://ustr.gov/about-us/policy-offices/press-office/press-releases/feed"
          check "commerce-news"    "https://www.commerce.gov/feeds/news"
          check "kotra-news"       "https://dream.kotra.or.kr/kotranews/cms/rss/actionKotraBoardRss.do?MENU_ID=70"
          echo "--- 해외 출처 후보 ---"
          check "fedreg-korea"     "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=Korea&conditions%5Bagencies%5D%5B%5D=international-trade-administration&conditions%5Bagencies%5D%5B%5D=industry-and-security-bureau&conditions%5Bagencies%5D%5B%5D=trade-representative-office-of-united-states&order=newest"
          check "fedreg-pres-trade" "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Btype%5D%5B%5D=PRESDOCU&conditions%5Bterm%5D=tariff%20OR%20imports&order=newest"
          check "whitehouse-actions" "https://www.whitehouse.gov/presidential-actions/feed/"
          check "ustr-rss"         "https://ustr.gov/rss.xml"
          check "eu-trade-news"    "https://policy.trade.ec.europa.eu/rss_en"
          check "eu-presscorner"   "https://ec.europa.eu/commission/presscorner/api/rss?language=en&pagesize=50"
          check "meti-en"          "https://www.meti.go.jp/english/rss/index.rdf"
          check "mofcom-en"        "http://english.mofcom.gov.cn/rss/rss.xml"
          check "imf-news"         "https://www.imf.org/en/News/RSS?Language=ENG"
          check "unctad-news"      "https://unctad.org/rss.xml"
          check "wto-news"         "https://www.wto.org/library/rss/latest_news_e.xml"
          check "bbc-business"     "https://feeds.bbci.co.uk/news/business/rss.xml"
          check "guardian-trade"   "https://www.theguardian.com/business/trade/rss"
          check "cnbc-economy"     "https://www.cnbc.com/id/20910258/device/rss/rss.html"
          check "nikkei-asia"      "https://asia.nikkei.com/rss/feed/nar"
          check "scmp-economy"     "https://www.scmp.com/rss/318421/feed"
          check "aljazeera-econ"   "https://www.aljazeera.com/xml/rss/all.xml"
          check "dw-business"      "https://rss.dw.com/rdf/rss-en-bus"
          check "gcaptain"         "https://gcaptain.com/feed/"
          check "splash247"        "https://splash247.com/feed/"
          check "loadstar"         "https://theloadstar.com/feed/"
          check "freightwaves"     "https://www.freightwaves.com/news/feed"
          for site in reuters.com apnews.com bloomberg.com ft.com asia.nikkei.com scmp.com; do
            check "gnews-$site" "https://news.google.com/rss/search?q=site%3A$site%20(tariff%20OR%20%22export%20controls%22%20OR%20sanctions%20OR%20%22trade%20deal%22)%20when%3A7d&hl=en-US&gl=US&ceid=US%3Aen"
          done
          echo "--- google news EN global trade sources ---"
          curl -sL -A "Mozilla/5.0" --max-time 25 "https://news.google.com/rss/search?q=tariff%20OR%20%22export%20controls%22%20OR%20%22trade%20deal%22%20when%3A2d&hl=en-US&gl=US&ceid=US%3Aen" | grep -o '<source url="[^"]*">[^<]*' | sort | uniq -c | sort -rn | head -30
          echo "--- google news sample sources ---"
          curl -sL -A "Mozilla/5.0" --max-time 25 "https://news.google.com/rss/search?q=%EA%B4%80%EC%84%B8%20when%3A7d&hl=ko&gl=KR&ceid=KR%3Ako" | grep -o '<source url="[^"]*">[^<]*' | sort | uniq -c | sort -rn | head -25
