name: GitSalt mirror

# 과제 제출용: GitHub main 을 GitSalt(gitsalt.com) 저장소로 그대로 복사해요.
# - 필요한 것: GitHub Secrets 의 GITSALT_TOKEN (GitSalt 설정 → 애플리케이션 → 토큰, 저장소 읽기·쓰기 권한)
# - 처음 한 번 원래 저장소 calc 를 tradecompass 로 이름을 바꾸고 이 저장소로 덮어썼어요 (과제 담당자 동의, 2026-10-06 완료).
# - 원본은 GitHub 예요. GitSalt 에서 직접 커밋하면 다음 복사가 실패해서 알려 줘요 (덮어쓰지 않아요).
# - 봇(GITHUB_TOKEN)이 올린 커밋은 push 이벤트를 만들지 않아서, 뉴스 수집·발행이 끝날 때도 다시 복사해요.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["News collect", "News publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitsalt-mirror
  cancel-in-progress: true

env:
  GS_HOST: gitsalt.com
  GS_USER: ksunghyun0125
  GS_REPO: tradecompass

jobs:
  mirror:
    # 같은 저장소가 GitSalt(Gitea Actions)에 복사돼도 거기서는 돌지 않게: 수집·발행·배포는 GitHub 에서만
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: tok
        env:
          TOKEN: ${{ secrets.GITSALT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "GITSALT_TOKEN 이 없어서 건너뛰어요 (README 의 GitSalt 제출 안내 참고)"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == '1'
        with:
          ref: main
          fetch-depth: 0
      - name: Push main
        if: steps.tok.outputs.ok == '1'
        env:
          TOKEN: ${{ secrets.GITSALT_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')   # 붙여넣을 때 섞인 줄바꿈·공백 제거
          remote="https://$GS_USER:$TOKEN@$GS_HOST/$GS_USER/$GS_REPO.git"
          # 강제로 덮어쓰지 않아요: GitSalt 에서 누가 직접 커밋했으면 실패해 알려 주고, 그 커밋은 지워지지 않아요.
          # GitSalt 서버가 가끔 접속을 거부해서(연결 실패) 최대 4번까지 간격을 늘려 다시 시도해요.
          for i in 1 2 3 4; do
            out=$(git push "$remote" HEAD:refs/heads/main 2>&1) && { echo "$out" | tail -2; echo "https://$GS_HOST/$GS_USER/$GS_REPO 에 $(git rev-parse --short HEAD) 를 올렸어요"; exit 0; }
            echo "$out" | sed "s#$TOKEN#***#g" | tail -3
            if echo "$out" | grep -qiE "rejected|non-fast-forward|fetch first"; then
              echo "::error::GitSalt main 에 GitHub 에 없는 커밋이 있어요. GitSalt 에서 직접 고친 내용을 GitHub 로 옮긴 뒤 다시 실행하세요."; exit 1
            fi
            sleep $((i * 30))
          done
          echo "::error::GitSalt 에 연결하지 못했어요 (서버가 접속을 거부). 다음 복사 때 자동으로 따라잡아요."; exit 1
