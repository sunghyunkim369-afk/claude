name: 고빈도(분봉 단타) 검증

# 바이낸스 1분봉(2021~)으로 분봉 단타 방식들을 비용별로 검증. 이 작업 공간에선 바이낸스 데이터 서버가 막혀 있어 GitHub 서버에서 돌림.
on:
  push:
    branches: [claude/sweet-bohr-g35f4h]
    paths:
      - .github/workflows/hft-lab.yml
      - coin-quant/coinquant/research/hft_lab.py
  workflow_dispatch:

permissions:
  contents: read

env:
  CODE_REF: claude/sweet-bohr-g35f4h

jobs:
  validate:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: coin-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.CODE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coin-quant/requirements.txt
      - run: pip install -r requirements.txt pyarrow
      - uses: actions/cache/restore@v4
        with:
          path: coin-quant/data_cache/binance/spot_1m
          key: spot-1m-${{ github.run_id }}
          restore-keys: spot-1m-
      - run: python -m coinquant hft-lab
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
      - name: 결과 문서 출력
        if: always()
        run: cat docs/hft-lab-*.md
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: coin-quant/data_cache/binance/spot_1m
          key: spot-1m-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hft-lab
          path: |
            coin-quant/docs/hft-lab-*.md
            coin-quant/reports/research/hft_lab_all.csv
