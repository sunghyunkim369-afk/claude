name: Media preview

# 이미지 기능 미리보기: 무료 사진 후보를 받아요 (수동 실행). 후보 사진 파일은 .gitignore 라 저장소에는 목록(photos.json)만 올라가요.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    # 같은 저장소가 GitSalt(Gitea Actions)에 복사돼도 거기서는 돌지 않게: 수집·발행·배포는 GitHub 에서만
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/elegant-heisenberg-s2a9ar
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/media/preview.js
      - run: |
          git config user.name "tradecompass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached data/media-preview 2>/dev/null || true
          git add data/media-preview
          git diff --cached --quiet && exit 0
          git commit -m "Media preview candidates"
          git pull --rebase origin claude/elegant-heisenberg-s2a9ar
          git push origin HEAD:claude/elegant-heisenberg-s2a9ar
