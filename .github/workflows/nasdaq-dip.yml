name: 나스닥 하락 매수 검토

# 나스닥 하락 매수 알고리즘 검토(사다리·추세 확인·적립식). 주식 시세 사이트가 막힌 곳이라 GitHub 서버에서 돌림.
on:
  push:
    branches: [claude/sweet-bohr-g35f4h]
    paths:
      - .github/workflows/nasdaq-dip.yml
      - coin-quant/coinquant/stocks/nasdaq_dip.py
  workflow_dispatch:

permissions:
  contents: read

env:
  CODE_REF: claude/sweet-bohr-g35f4h

jobs:
  validate:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: coin-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.CODE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coin-quant/requirements-stocks.txt
      - run: pip install -r requirements-stocks.txt
      - uses: actions/cache/restore@v4
        with:
          path: coin-quant/data_cache/stocks
          key: stocks-data-${{ github.run_id }}
          restore-keys: stocks-data-
      - run: python -m coinquant nasdaq-dip
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
      - name: 결과 문서 출력
        run: cat docs/nasdaq-dip-*.md
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: coin-quant/data_cache/stocks
          key: stocks-data-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasdaq-dip
          path: |
            coin-quant/docs/nasdaq-dip-*.md
            coin-quant/reports/research/stocks_*.csv
