name: News collect

# 6시간마다 공식·유명 출처에서 무역 기사를 모아 data/news/archive.json 에 쌓아요.
# 처음 한 번은 Actions 화면에서 backfill 을 켜고 실행하면 직전 5주치를 채워요.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "직전 5주치를 한 번에 채우기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/elegant-heisenberg-s2a9ar
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node scripts/news/collect.js ${{ inputs.backfill && '--backfill' || '' }}
      - name: Commit archive
        run: |
          git config user.name "tradecompass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/archive.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "News: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin claude/elegant-heisenberg-s2a9ar && git push origin HEAD:claude/elegant-heisenberg-s2a9ar && exit 0
            sleep $((i * 5))
          done
          exit 1
