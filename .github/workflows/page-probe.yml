name: Page probe

# 외부 서비스 페이지를 받아 글자만 보여주는 수동 점검 (작업 공간에서 직접 못 여는 사이트 확인용)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 주소"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          URL: ${{ inputs.url }}
        run: |
          set +e
          host=$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')
          echo "host=$host IP=$(getent hosts "$host" | awk '{print $1}' | head -1)"
          curl -sSL -A "Mozilla/5.0" --max-time 20 -o page.html -w 'HTTP %{http_code} · %{url_effective}\n' "$URL"
          python3 - <<'PY'
          import re, html
          t = open("page.html", encoding="utf-8", errors="ignore").read()
          print("--- 제목 ---", re.findall(r"<title>(.*?)</title>", t, re.S)[:1])
          print("--- 링크 ---")
          for h in sorted(set(re.findall(r'href="([^"#]+)"', t)))[:60]: print(h)
          t = re.sub(r"(?is)<(script|style|svg)[^>]*>.*?</\1>", " ", t)
          t = html.unescape(re.sub(r"(?s)<[^>]+>", "\n", t))
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          print("--- 본문 ---"); print("\n".join(lines)[:6000])
          PY
