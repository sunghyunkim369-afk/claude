name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/elegant-heisenberg-s2a9ar]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 같은 저장소가 GitSalt(Gitea Actions)에 복사돼도 거기서는 돌지 않게: 수집·발행·배포는 GitHub 에서만
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r tradecompass-mvp hs-code-finder shared _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
