name: Robots probe

# 뉴스·사진 출처의 robots.txt 와 운영 사이트 보안 헤더를 확인하는 수동 점검 (공개 사이트만)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          for h in www.korea.kr news.google.com www.yna.co.kr www.hankyung.com www.mk.co.kr www.wto.org ustr.gov www.whitehouse.gov www.federalregister.gov ec.europa.eu asia.nikkei.com www.scmp.com gcaptain.com theloadstar.com commons.wikimedia.org; do
            echo "===== $h ====="
            curl -sL -A "Mozilla/5.0 (TradeCompass robots check)" --max-time 15 "https://$h/robots.txt" -o r.txt -w 'HTTP %{http_code}\n'
            # 줄 끝 CR 을 지우고(Windows 줄바꿈이면 "*" 비교가 틀려요) User-agent: * 구간만 보여줘요
            tr -d '\r' < r.txt | awk 'BEGIN{IGNORECASE=1} /^user-agent:/{ua=($2=="*")} ua' | grep -iE '^(user-agent|disallow|allow)' | head -60
            sleep 2
          done
          echo "===== 정책브리핑 RSS 후보 ====="
          for u in https://www.korea.kr/rss/policy.xml https://www.korea.kr/rss/pressrelease.xml https://www.korea.kr/rss/dept_motie.xml https://www.korea.kr/rss/dept_kcs.xml https://www.korea.kr/etc/rss.do; do
            code=$(curl -sL -A "Mozilla/5.0 (TradeCompass)" --max-time 15 -o f.xml -w '%{http_code}' "$u"); n=$(grep -o '<item' f.xml | wc -l)
            echo "$code items=$n  $u  $(grep -o '<title>[^<]*' f.xml | sed -n 2p | head -c 60)"; sleep 2
          done
          echo "===== 정책브리핑 RSS 안내 페이지에서 찾은 주소 ====="
          i=0
          for g in https://www.korea.kr/etc/rss.do https://www.korea.kr/etc/rssGuide.do https://www.korea.kr/main.do; do
            i=$((i + 1)); touch g$i.html
            code=$(curl -sL -A "Mozilla/5.0 (compatible; TradeCompassBot/1.0)" --max-time 40 -o g$i.html -w '%{http_code}' "$g" || true)
            echo "$code $g ($(wc -c < g$i.html) bytes)"
            grep -oiE '(https?://(www\.)?korea\.kr)?/[^"'"'"' ]*rss[^"'"'"' ]*' g$i.html | sort -u | head -40 || true
            sleep 2
          done
          for u in $(cat g*.html 2>/dev/null | grep -oiE '(https?://(www\.)?korea\.kr)?/rss/[A-Za-z0-9_./-]*\.xml' | sed 's#^/#https://www.korea.kr/#' | sort -u | head -12); do
            code=$(curl -sL -A "Mozilla/5.0 (compatible; TradeCompassBot/1.0)" --max-time 30 -o f.xml -w '%{http_code}' "$u" || true); touch f.xml; n=$(grep -o '<item' f.xml | wc -l)
            echo "$code items=$n  $u  $(grep -o '<title>[^<]*' f.xml | sed -n 2p | head -c 60)"; sleep 2
          done
          echo "===== tcmvp.eyefeet.com 응답 헤더 ====="
          curl -sI --max-time 15 https://tcmvp.eyefeet.com/tradecompass-mvp/ | grep -iE '^(HTTP|content-security|x-frame|x-content-type|referrer-policy|strict-transport|permissions-policy|server)'
