name: Robots probe

# 뉴스·사진 출처의 robots.txt 와 운영 사이트 보안 헤더를 확인하는 수동 점검 (공개 사이트만)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          for h in news.google.com www.yna.co.kr www.hankyung.com www.mk.co.kr www.wto.org ustr.gov www.whitehouse.gov www.federalregister.gov ec.europa.eu asia.nikkei.com www.scmp.com gcaptain.com theloadstar.com commons.wikimedia.org; do
            echo "===== $h ====="
            curl -sL -A "Mozilla/5.0 (TradeCompass robots check)" --max-time 15 "https://$h/robots.txt" -o r.txt -w 'HTTP %{http_code}\n'
            # User-agent: * 구간만 보여줘요
            awk 'BEGIN{IGNORECASE=1} /^user-agent:/{ua=($2=="*")} ua' r.txt | grep -iE '^(user-agent|disallow|allow)' | head -40
            sleep 2
          done
          echo "===== tcmvp.eyefeet.com 응답 헤더 ====="
          curl -sI --max-time 15 https://tcmvp.eyefeet.com/tradecompass-mvp/ | grep -iE '^(HTTP|content-security|x-frame|x-content-type|referrer-policy|strict-transport|permissions-policy|server)'
