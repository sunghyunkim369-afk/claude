name: stock 데이터 출처 확인

# 주식 시황·신호 기능을 만들기 전에, GitHub 서버에서 시세·뉴스 출처가 열리는지 확인 (로그만 남김, 저장소에 쓰지 않음)
on:
  push:
    branches: [claude/sweet-bohr-g35f4h]
    paths:
      - .github/workflows/stock-probe.yml
      - coin-quant/scripts/actions/stock_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance finance-datareader pykrx
      - run: python coin-quant/scripts/actions/stock_probe.py
