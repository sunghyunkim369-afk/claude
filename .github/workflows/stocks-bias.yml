name: 주식 공식 편향 점검

# 주식 지수 공식의 편향(선택·배당·현금 이자·세금·시작 시점·환율·지연)을 점검하고 결과 문서를 아티팩트로 남김 (저장소에 쓰지 않음).
# 이 작업 환경은 주식 시세 사이트가 막혀 있어 GitHub 서버에서 돌림. 잠가 뒀던 2025-01 이후는 7절에서만 한 번 공개.
on:
  push:
    branches: [claude/sweet-bohr-g35f4h]
    paths:
      - .github/workflows/stocks-bias.yml
      - coin-quant/coinquant/stocks/bias_check.py
  workflow_dispatch:

permissions:
  contents: read

env:
  CODE_REF: claude/sweet-bohr-g35f4h

jobs:
  validate:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: coin-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.CODE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coin-quant/requirements-stocks.txt
      - run: pip install -r requirements-stocks.txt
      - uses: actions/cache/restore@v4
        with:
          path: coin-quant/data_cache/stocks
          key: stocks-data-${{ github.run_id }}
          restore-keys: stocks-data-
      - run: python -m coinquant stocks-bias
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
      - name: 결과 문서 출력
        run: cat docs/stocks-bias-*.md
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: coin-quant/data_cache/stocks
          key: stocks-data-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-bias
          path: |
            coin-quant/docs/stocks-bias-*.md
            coin-quant/reports/research/stocks_*.csv
