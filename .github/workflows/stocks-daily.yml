name: 주식 오늘의 소식 (매일)

# 평일 아침 07:40 KST: 시장 지표·어젯밤 발표 결과·주요 뉴스(해외·국내)·실적·경제지표 일정·나만의 매수 신호 → 페이지 + 텔레그램.
# 페이지는 stock-briefing 브랜치의 daily/날짜.md 에 올림 (예약·수동 실행 때만). 코드 브랜치에 push 하면 시험 실행만(올리지 않음).
# 필요: Settings → Secrets → Actions 에 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. 예약 실행은 이 파일이 기본 브랜치에 있어야 동작.
# GitHub 예약은 몇 시간씩 늦거나 빠질 때가 있어 4번 걸어 둠 → 그날 처음 성공한 1번만 보내고 나머지는 건너뜀.
# 실제 실행 내용은 코드 브랜치의 _stocks-run.yml (고쳐도 기본 브랜치에 다시 합칠 필요 없음).
on:
  schedule:
    - cron: "40 21 * * 0-4"   # UTC 일~목 21:40 = KST 월~금 06:40
    - cron: "40 22 * * 0-4"   # KST 07:40
    - cron: "10 0 * * 1-5"    # KST 09:10 (앞 예약이 안 돌았을 때 대비)
    - cron: "40 1 * * 1-5"    # KST 10:40
  push:
    branches: [claude/sweet-bohr-g35f4h]
    paths:
      - .github/workflows/stocks-daily.yml
      - .github/workflows/_stocks-run.yml
      - coin-quant/coinquant/stocks/brief.py
      - coin-quant/coinquant/stocks/news.py
      - coin-quant/coinquant/stocks/calendar.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocks-daily
  cancel-in-progress: false

jobs:
  run:
    if: github.server_url == 'https://github.com'
    uses: sunghyunkim369-afk/claude/.github/workflows/_stocks-run.yml@claude/sweet-bohr-g35f4h
    secrets: inherit
