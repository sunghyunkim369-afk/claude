name: Team mate diff check

# 팀 저장소(GitSalt leesumin1517/tradecompass) dev 의 mate/ 가 우리 main 과 어떻게 다른지 확인만 해요 (아무것도 올리지 않아요).
# 다른 파일마다: 우리 옛 커밋에 있던 내용이면 "옛 버전", 우리 기록에 없는 내용이면 "팀원이 고쳤을 수 있음".
# 이 저장소는 공개라 로그도 공개예요. 우리 파일 경로만 출력하고, 우리 main 에 없는 mate/ 파일은 개수만 출력해요.
on:
  push:
    branches: [score-v2]
    paths: [".github/workflows/team-diff-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GS_HOST: gitsalt.com
  GS_USER: ksunghyun0125
  TEAM_REPO: leesumin1517/tradecompass

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: ours
      - name: Compare
        env:
          TOKEN: ${{ secrets.GITSALT_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          remote="https://$GS_USER:$TOKEN@$GS_HOST/$TEAM_REPO.git"
          for i in 1 2 3; do git clone -q --no-checkout "$remote" team 2>/dev/null && break; rm -rf team; sleep $((i * 20)); done
          [ -d team ] || { echo "::error::팀 저장소를 받지 못했어요"; exit 1; }
          cd team && git checkout -q origin/dev && cd ../ours
          echo "우리 main: $(git rev-parse --short HEAD) ($(git log -1 --format=%ci))"
          same=0
          while IFS= read -r f; do
            t="../team/mate/$f"
            if [ ! -f "$t" ]; then echo "없음      $f"; continue; fi
            if cmp -s "$f" "$t"; then same=$((same+1)); continue; fi
            h=$(git hash-object "$t")
            # 우리 기록에서 같은 내용이 있었던 가장 최근 커밋 찾기
            hit=""
            for c in $(git log --format=%h -- "$f"); do
              [ "$(git rev-parse -q --verify "$c:$f" 2>/dev/null)" = "$h" ] && { hit="$c $(git log -1 --format=%cs "$c")"; break; }
            done
            if [ -n "$hit" ]; then echo "옛 버전   $f  (우리 커밋 $hit 의 내용)"; else echo "기록 없음 $f  (팀원이 고쳤을 수 있음)"; fi
          done < <(git ls-tree -r --name-only HEAD)
          echo "같은 파일 ${same}개"
          extra=$(cd ../team/mate && git -C .. ls-files mate | sed 's#^mate/##' | while IFS= read -r f; do git -C ../../ours cat-file -e "HEAD:$f" 2>/dev/null || echo x; done | grep -c x || true)
          echo "우리 main 에 없는 mate/ 파일 ${extra}개 (이름은 출력하지 않아요)"
          echo "mate/ 가 들어온 팀 저장소 커밋 날짜: $(cd ../team && git log -1 --format=%cs -- mate)"
