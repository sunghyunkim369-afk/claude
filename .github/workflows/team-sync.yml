name: Team sync (mate)

# 팀 저장소(GitSalt leesumin1517/tradecompass)의 dev 브랜치 mate/ 폴더를 우리 GitHub main 과 똑같이 맞춰요.
# - 팀원 동의(2026-10-15): dev 에 봇이 자동 커밋해도 됨, 뉴스 데이터도 맞춤, dev → main 합치기는 팀원이 함.
# - mate/tradecompass-mvp/auth.js 는 팀원이 고친 로그인 파일이라 덮어쓰지 않아요.
# - 그 밖에 팀원이 mate/ 파일을 직접 고쳤으면(우리 기록에 없는 내용) 덮어쓰지 않고 멈춰서 알려 줘요.
# - api/·.github/·vercel.json 은 팀 서버에서 쓰지 않아서 mate/ 에 넣지 않아요 (팀원 요청, 2026-10-16).
# - 우리 main 에서 지운 파일은 mate/ 에서도 지우고, 팀원이 mate/ 에 새로 넣은 파일은 그대로 둬요.
# - 강제로 덮어쓰지 않아요. 팀원이 그사이 dev 에 올렸으면 새로 받아서 다시 맞춰요.
# - 이 저장소는 공개라 로그도 공개예요. 우리 파일 경로와 개수만 출력해요.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["News collect", "News publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-sync
  cancel-in-progress: false

env:
  GS_HOST: gitsalt.com
  GS_USER: ksunghyun0125
  TEAM_REPO: leesumin1517/tradecompass
  TEAM_BRANCH: dev
  KEEP: tradecompass-mvp/auth.js
  # 팀 서버에서 쓰지 않아서 mate/ 에 넣지 않는 것 (팀원 요청, 2026-10-16): Vercel 서버 함수, Vercel 설정, GitHub 자동 작업
  SKIP: "api .github vercel.json"

jobs:
  sync:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: ours
      - name: Sync mate/ on team dev
        env:
          TOKEN: ${{ secrets.GITSALT_TOKEN }}
        run: |
          set -u
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          [ -n "$TOKEN" ] || { echo "::error::GITSALT_TOKEN 이 없어요"; exit 1; }
          remote="https://$GS_USER:$TOKEN@$GS_HOST/$TEAM_REPO.git"
          hide() { sed "s#$TOKEN#***#g"; }
          OURS=$PWD/ours
          SRC=$(git -C "$OURS" rev-parse --short HEAD)

          # 우리 기록(어느 커밋이든)에 그 경로로 있었던 내용인지: 맞으면 팀원이 고친 게 아니에요
          known() {  # $1 경로, $2 파일
            local h; h=$(git hash-object "$2")
            git -C "$OURS" log --all --format=%H -- "$1" | while read -r c; do
              [ "$(git -C "$OURS" rev-parse -q --verify "$c:$1" 2>/dev/null)" = "$h" ] && { echo y; break; }
            done | grep -q y
          }

          for attempt in 1 2 3; do
            rm -rf team
            ok=0
            for i in 1 2 3 4; do
              git clone -q --branch "$TEAM_BRANCH" "$remote" team 2>err.txt && { ok=1; break; }
              hide < err.txt | tail -2; rm -rf team; sleep $((i * 20))
            done
            [ "$ok" = 1 ] || { echo "::error::팀 저장소를 받지 못했어요 (연결 또는 권한)"; exit 1; }
            M=$PWD/team/mate
            [ -d "$M" ] || { echo "::error::팀 저장소 $TEAM_BRANCH 에 mate/ 가 없어요"; exit 1; }

            # 1) 팀원이 고친 파일이 있는지 (auth.js 와 기록 파일은 빼고)
            touched=""; extra=0; gone=""
            while IFS= read -r f; do
              [ "$f" = "$KEEP" ] && continue
              [ "$f" = ".synced-from" ] && continue
              skipme=0; for x in $SKIP; do case "$f" in "$x"|"$x"/*) skipme=1;; esac; done; [ "$skipme" = 1 ] && continue
              if git -C "$OURS" cat-file -e "HEAD:$f" 2>/dev/null; then
                git -C "$OURS" show "HEAD:$f" | cmp -s - "$M/$f" && continue
                known "$f" "$M/$f" || touched="$touched $f"
              else
                # 우리 main 에 없는 파일: 우리가 예전에 지운 파일이면 지우고, 팀원이 새로 넣은 파일이면 둬요
                if known "$f" "$M/$f"; then gone="$gone $f"; else extra=$((extra+1)); fi
              fi
            done < <(cd "$M" && git ls-files . | sed 's#^\./##')
            if [ -n "$touched" ]; then
              echo "::error::팀원이 mate/ 에서 직접 고친 것으로 보이는 파일이 있어서 맞추지 않았어요:"
              for f in $touched; do echo "  $f"; done
              echo "이 파일들을 우리 GitHub 쪽에 반영하거나, 팀원이 원래대로 돌린 뒤 다시 실행하세요"
              exit 1
            fi
            [ "$extra" = 0 ] || echo "참고: 팀원이 mate/ 에 새로 넣은 파일 ${extra}개는 그대로 둬요"

            # 2) 우리 main 내용으로 맞추기 (auth.js 는 mate/ 에 없을 때만 넣어요)
            keep_tmp=""
            [ -f "$M/$KEEP" ] && { keep_tmp=$(mktemp); cp "$M/$KEEP" "$keep_tmp"; }
            ex=(); for x in $SKIP; do ex+=(":(exclude)$x"); done
            git -C "$OURS" archive HEAD -- . "${ex[@]}" | tar -x -C "$M"
            for x in $SKIP; do
              if [ -e "$M/$x" ]; then git -C team rm -r -q --ignore-unmatch "mate/$x"; rm -rf "$M/$x"; echo "뺌: $x (팀 서버에서 안 씀)"; fi
            done
            [ -n "$keep_tmp" ] && cp "$keep_tmp" "$M/$KEEP"
            for f in $gone; do git -C team rm -q "mate/$f"; echo "지움: $f"; done
            git -C "$OURS" rev-parse HEAD > "$M/.synced-from"

            cd team
            git config user.name "sunghyunkim369 (GitHub Actions)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A mate
            if git diff --cached --quiet; then echo "이미 같아요 (우리 main $SRC)"; exit 0; fi
            echo "바뀐 파일 $(git diff --cached --name-only | wc -l)개:"; git diff --cached --name-only | sed 's#^mate/#  #' | head -40
            git commit -q -m "mate: 성현 저장소 main $SRC 와 맞춤 (자동)" \
              -m "GitHub sunghyunkim369-afk/claude main 에서 자동으로 맞췄어요. mate/tradecompass-mvp/auth.js 는 건드리지 않아요."
            out=$(git push -q "$remote" "HEAD:refs/heads/$TEAM_BRANCH" 2>&1) && { echo "팀 저장소 $TEAM_BRANCH 에 올렸어요 ($(git rev-parse --short HEAD), 우리 main $SRC)"; exit 0; }
            echo "$out" | hide | tail -3
            cd ..
            echo "올리기가 거절됐어요 (그사이 팀원이 올렸을 수 있음). 새로 받아서 다시 맞춰요 ($attempt/3)"
            sleep $((attempt * 15))
          done
          echo "::error::팀 저장소에 올리지 못했어요"; exit 1
