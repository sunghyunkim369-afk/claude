name: Tests

# 회원 기능(파일·PostgreSQL), Top10 대표 기사 선정, 24시간 속보, AI 안전장치 테스트
# main 의 결과는 GitSalt 커밋 옆에도 ✅/❌ 로 표시해요 (GitSalt 에는 실행 서버(러너)가 없어서 GitHub 에서 돌린 결과를 보내요)
on:
  push:
    branches: [claude/elegant-heisenberg-s2a9ar, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 같은 저장소가 GitSalt(Gitea Actions)에 복사돼도 거기서는 돌지 않게: 수집·발행·배포는 GitHub 에서만
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # GitSalt 복사를 최대 10분 기다리는 단계 포함
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - name: Report result to GitSalt (커밋 옆 ✅/❌)
        if: always() && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITSALT_TOKEN }}
          STATE: ${{ job.status }}
        run: |
          [ -z "$TOKEN" ] && { echo "GITSALT_TOKEN 없음, 건너뛰어요"; exit 0; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          remote="https://ksunghyun0125:$TOKEN@gitsalt.com/ksunghyun0125/tradecompass.git"
          api="https://gitsalt.com/api/v1/repos/ksunghyun0125/tradecompass"
          # 복사 작업(GitSalt mirror)이 이 커밋을 GitSalt 에 올릴 때까지 최대 10분 기다려요
          for i in $(seq 1 40); do
            [ "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] && break
            sleep 15
          done
          state=$([ "$STATE" = "success" ] && echo success || echo failure)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"tests (GitHub Actions)\",\"description\":\"npm test: 회원·뉴스 점수·속보·AI 안전장치\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$api/statuses/$GITHUB_SHA")
          echo "GitSalt 커밋 ${GITHUB_SHA:0:7} 에 $state 표시 (HTTP $code)"
