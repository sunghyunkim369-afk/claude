name: Tests

# 회원 기능(파일·PostgreSQL), Top10 대표 기사 선정, 24시간 속보, AI 안전장치 테스트
# main 의 결과는 GitSalt 커밋 옆에도 ✅/❌ 로 표시해요 (GitSalt 에는 실행 서버(러너)가 없어서 GitHub 에서 돌린 결과를 보내요)
on:
  push:
    branches: [claude/elegant-heisenberg-s2a9ar, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 같은 저장소가 GitSalt(Gitea Actions)에 복사돼도 거기서는 돌지 않게: 수집·발행·배포는 GitHub 에서만
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # GitSalt 복사를 최대 10분 기다리는 단계 포함
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - name: Report result to GitSalt (커밋 옆 ✅/❌)
        if: always() && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITSALT_TOKEN }}
          STATE: ${{ job.status }}
        run: |
          [ -z "$TOKEN" ] && { echo "GITSALT_TOKEN 없음, 건너뛰어요"; exit 0; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          api="https://gitsalt.com/api/v1/repos/ksunghyun0125/tradecompass"
          state=$([ "$STATE" = "success" ] && echo success || echo failure)
          body="{\"state\":\"$state\",\"context\":\"tests (GitHub Actions)\",\"description\":\"npm test: 회원·뉴스 점수·속보·AI 안전장치\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
          # 복사 작업(GitSalt mirror)이 이 커밋을 올리기 전이면 GitSalt 가 404 를 돌려줘요 → 최대 8분 동안 다시 시도
          for i in $(seq 1 32); do
            code=$(curl -s -o resp.txt -w '%{http_code}' --max-time 20 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d "$body" "$api/statuses/$GITHUB_SHA" || true)   # 연결 실패(000)도 다시 시도
            echo "시도 $i: HTTP $code"
            case "$code" in 2*) echo "GitSalt 커밋 ${GITHUB_SHA:0:7} 에 $state 표시"; exit 0;; 404|409|422|5*|000) sleep 15;; *) head -c 300 resp.txt; echo; exit 0;; esac
          done
          echo "::warning::GitSalt 에 상태를 붙이지 못했어요 (커밋이 아직 복사되지 않았거나 GitSalt 에 연결되지 않음). 테스트 결과에는 영향 없어요."
