name: Tests

# 회원 기능(파일·PostgreSQL), Top10 대표 기사 선정, 24시간 속보, AI 안전장치 테스트
on:
  push:
    branches: [claude/elegant-heisenberg-s2a9ar, main]
    paths: ["api/**", "scripts/**", "tests/**", "package.json", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
