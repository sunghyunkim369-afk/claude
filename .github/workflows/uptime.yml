name: Uptime check

# 매시간 사이트가 열리는지 확인하고, 실패하면 이슈를 열어 메일로 알려요.
# 다시 정상이 되면 이슈에 기록을 남기고 닫아요.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoints
        id: check
        shell: bash
        run: |
          urls=(
            "https://tcmvp.eyefeet.com/"
            "https://tcmvp.eyefeet.com/tradecompass-mvp/"
            "https://tcmvp.eyefeet.com/hs-code-finder/"
            "https://tcmvp.eyefeet.com/api/health"
            "https://sunghyunkim369-afk.github.io/claude/tradecompass-mvp/"
          )
          failed=""
          for u in "${urls[@]}"; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 20 -L "$u" || echo 000)
            note=""
            # 헬스 체크는 서버 함수가 실제로 실행됐는지(응답에 "ok":true)까지 확인해요
            if [[ "$u" == */api/health ]] && ! grep -q '"ok":true' body.txt; then note=" (서버 함수가 실행되지 않음: 런타임 확인)"; code_bad=1; else code_bad=0; fi
            echo "$code  $u$note"
            # 헬스 응답에는 환경변수 설정 여부(true/false)만 들어 있어서 그대로 남겨도 안전해요
            if [[ "$u" == */api/health ]]; then echo "    $(head -c 400 body.txt)"; fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ] || [ "$code_bad" = 1 ]; then failed+="- \`$code\` $u$note"$'\n'; fi
          done
          # 회원 기능 확인 (계정을 만들지 않는 요청): 401 = 동작 중(로그인 안 된 상태), 503 = 준비 중
          auth=$(curl -s -o auth.txt -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -H 'Origin: https://tcmvp.eyefeet.com' -d '{"action":"me"}' https://tcmvp.eyefeet.com/api/auth || echo 000)
          echo "$auth  https://tcmvp.eyefeet.com/api/auth (401=동작 중, 503=준비 중)  $(head -c 200 auth.txt)"
          {
            echo "failed<<EOF"
            printf '%s' "$failed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or close the incident issue
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.check.outputs.failed }}
        with:
          script: |
            const title = "🔴 사이트 접속 장애";
            const failed = process.env.FAILED.trim();
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "uptime" });
            const issue = open.find(i => i.title === title);
            const when = new Date().toISOString();
            if (failed) {
              const body = `${when} 점검에서 열리지 않은 주소:\n\n${failed}\n\n[실행 기록](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
              if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body, labels: ["uptime"] });
              core.setFailed("Some endpoints are down");
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `${when} 점검에서 모두 정상으로 돌아왔어요.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }
