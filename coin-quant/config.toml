# coin-quant 설정 파일
# 숫자를 바꾸면 백테스트·리포트·주문이 모두 이 값을 씁니다. (비밀 값은 여기 말고 .env 에)

[data]
# 데이터 보관 폴더 (저장소에 올리지 않음)
cache_dir = "data_cache"
# 일봉 기준 시각: 업비트·바이낸스 일봉 모두 UTC 00:00(= KST 09:00)에 끊깁니다. 바꾸지 마세요.
bar_close = "UTC 00:00 (KST 09:00)"
# 시계열이 이 일수 이상 끊기면 다른 코인으로 봅니다 (예: 옛 LUNA → 새 LUNA 심볼 재사용)
gap_split_days = 10

[universe]
core = ["BTC", "ETH", "SOL"]
# 기타 그룹: 그 날짜 시가총액 상위 N개 (코어 제외)
others_top_n = 30
include_meme = false
# 순위 기준: "mcap" (Coin Metrics 시가총액) 또는 "volume" (최근 30일 거래대금, 상장폐지 포함 전체 페어로 계산)
rank_method = "mcap"
# 최소 거래 일수. 200일선 같은 지표가 계산되려면 200일이 필요해서, 모든 신호를 같은 조건으로 비교하려고 200으로 둠
min_history_days = 200

[costs]
fee = 0.0005            # 업비트 KRW 마켓 0.05% (한 번 매매마다)
slippage_core = 0.001   # 코어 0.1%
slippage_other = 0.003  # 기타 0.3%

[portfolio]
core_weight = 0.70
other_weight = 0.30
max_weight_per_coin = 0.35
max_orders_per_day = 10
max_total_invest = 1.0      # 총 투자 한도 (1.0 = 평가금의 100%)
min_trade_weight = 0.01     # 이보다 작은 비중 변화는 주문하지 않음 (잦은 매매 비용 방지)
rebalance_days = 1          # 1 = 매일, 3 = 3일, 7 = 주 1회 (스윙은 매일 판단)

[formula]
# 공식 (검증 결과를 보고 같이 정함). status 가 "확정" 이 되기 전까지 리포트에 '임시'로 표시됩니다.
# 신호 이름: python -m coinquant validate 결과의 신호 이름, "추세:<방식>"(coinquant/trend.py), 또는 "보유"
# 확정 (2026-10-21): 후보 7번 '스윙(중기 중심)'. 근거: docs/trend-study-2026-10-21.md, docs/candidates-2026-10-21.md
# 최종 검증 결과: docs/final-check-2026-10-21.md — 이 값을 바꾸면 최종 검증은 다시 '처음 보는 데이터'가 아닙니다.
status = "확정"
core_signal = "추세:중기 보유 + 장기 하락이면 중단"
others_signal = "추세:중기 보유 + 장기 하락이면 중단"
others_select = "균등"
others_k = 10
regime_filter = "BTC 200일선 위"
regime_applies_to = ["others"]

[validation]
# 이 날짜 이후는 '최종 검증 구간' — 공식을 고른 뒤 딱 한 번만 엽니다.
holdout_start = "2025-01-01"
# 워크포워드: 학습 N개월 → 다음 M개월 검증, M개월씩 밀기
wf_train_months = 24
wf_test_months = 6
random_placebo_draws = 200

[report]
output_dir = "reports"
format = "html"   # "html" 또는 "md"
news_max_items = 5

[trading]
# 1 = 추천만, 2 = 확인(y/N) 후 주문. 자동 주문은 auto_order = true 를 직접 켤 때만.
stage = 1
auto_order = false
paper = true            # true면 모의 주문 (실제 거래소로 보내지 않음)
max_order_krw = 100000  # 2단계 소액 시험: 주문 1건 최대 금액
# 매수 체결 방식 (docs/limit-entry-2026-10-21.md 검증 결과)
#  "limit": 판단 날 종가 × (1 − 할인율)에 지정가. 안 닿으면 그날은 보내고, 신호가 켜져 있으면 다음 날 같은 방식으로 다시 겁니다.
#  "market": 다음 날 시장가
buy_order = "limit"
limit_discount_core = 0.01    # 코어 −1% (매일 다시 걸 때 시장가와 같거나 조금 나았음)
limit_discount_other = 0.03   # 기타(알트) −3% (한 번만 걸어도 시장가보다 나았음)
# 매도는 항상 시장가 (손절이 늦어지면 손실이 커짐)

[alert]
# 매수·매도 알림 (python -m coinquant alert, 매일 예약 실행에서 자동)
# daily_summary = true: 매일 시황 + 신호를 보냄 (상태가 바뀐 날은 🔔 표시). false 면 상태가 바뀐 날만
daily_summary = true
telegram = true    # .env 에 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 를 넣어야 동작
windows = true     # 윈도우 PC 알림

[ai]
# 뉴스 AI 요약 (선택) — ANTHROPIC_API_KEY 가 .env(PC) 또는 GitHub Secrets 에 있을 때만 동작, 없으면 기사 제목만 보여 줌.
# 비용 대략: 하루 3번 호출(코인 1 + 주식 2) × 약 $0.03 = 한 달 $2~3. 더 싸게: model = "claude-haiku-5-5" (한 달 몇 센트, 요약 품질은 낮을 수 있음)
model = "claude-opus-5-5"
effort = "low"

[short_mode]
# 단기 모드: 단기 점수 +2 이상 켜기 / 0 이하 끄기, 코어 3개 균등, 자금의 sleeve 만 (근거: docs/short-swing-2026-10-21.md)
# 깨끗한 검증 구간이 남아 있지 않아 start 부터 모의 성적을 쌓음. paper = true 면 메시지에 기록만, 주문 없음.
# 2~3개월 모의 성적이 확정 공식만보다 나쁘지 않을 때만 paper = false 로 바꾸는 걸 권함 (실제 주문은 여전히 확인 y/N).
enabled = true
paper = true
sleeve = 0.30
start = "2026-10-29"
