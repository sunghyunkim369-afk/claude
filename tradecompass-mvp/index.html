<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradeCompass</title>
<script>try{var t=localStorage.getItem("tc-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="color-scheme" content="light dark">
<script src="../shared/error-logger.js"></script>
<script src="../shared/ai-client.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="tc-face" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FBF3E4"/><stop offset="1" stop-color="#E9DAC0"/>
    </radialGradient>
    <linearGradient id="tc-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0BE83"/><stop offset=".5" stop-color="#B8873B"/><stop offset="1" stop-color="#7E5A22"/>
    </linearGradient>
  </defs>
</svg>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M21.5 10.5 17.8 17.8 10.5 21.5 14.2 14.2Z" fill="var(--navy)"/>
        <circle cx="16" cy="16" r="1.4" fill="var(--paper)"/>
      </svg>
      <span class="wordmark">Trade<em>Compass</em><small>GLOBAL TRADE INTELLIGENCE</small></span>
    </a>

    <nav>
      <p class="nav-h">워크스페이스</p>
      <a href="#/" data-view="home">대시보드</a>
      <a href="#/news" data-view="news">무역 뉴스 <span class="count" id="nav-news"></span></a>
      <a href="#/sectors" data-view="sectors">섹터 분석</a>
      <a href="#/watch" data-view="watch">관심 섹터</a>
      <a href="#/method" data-view="method">순위 산정 방식</a>

      <p class="nav-h">직구·여행 통관 도우미</p>
      <a href="#/hs" data-view="hs">HS 코드 · 통관 계산</a>
      <a href="#/travel" data-view="travel">여행자 면세 계산기</a>
      <a href="#/check" data-view="check">직구 반입 체커</a>
      <a href="#/track" data-view="track">통관 진행 조회</a>
    </nav>

    <form class="quick" id="quick">
      <label for="quick-q">HS 코드 빠른 검색</label>
      <input id="quick-q" type="search" placeholder="품목명 (예: 반도체)" autocomplete="off">
    </form>
  </aside>

  <div class="main">
    <header class="top">
      <button class="menu" id="menu" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="top-date" id="top-date"></div>
      <button type="button" class="theme-btn" id="theme-btn" aria-label="어두운 화면으로"></button>
      <div class="top-badges">
        <span class="pill ai"><i></i><span id="upd"></span></span>
        <span class="pill sample" id="sample-pill" hidden>샘플 데이터</span>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">뉴스 흐름을 AI가 정리한 참고자료이며 투자 권유가 아닙니다. 실제 판단은 원문과 함께 확인하신 뒤 직접 하시기 바랍니다.</footer>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<nav class="tabbar" aria-label="빠른 이동">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1Z"/></svg><span>홈</span></a>
  <a href="#/news" data-tab="news"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h11v14H6a1 1 0 0 1-1-1Zm11 4h3v9a1 1 0 0 1-1 1h-2M8 9h5M8 12h5M8 15h3"/></svg><span>뉴스</span></a>
  <a href="#/sectors" data-tab="sectors"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></svg><span>섹터</span></a>
  <a href="#/tools" data-tab="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>도구</span></a>
  <a href="#/watch" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span>내 정보</span></a>
</nav>

<script src="data.js"></script>
<script src="breaking.js"></script>
<script src="tools.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
