<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무역나침반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M21.5 10.5 17.8 17.8 10.5 21.5 14.2 14.2Z" fill="var(--navy)"/>
        <circle cx="16" cy="16" r="1.4" fill="var(--paper)"/>
      </svg>
      <span>무역나침반<small>TRADE COMPASS</small></span>
    </a>

    <nav>
      <p class="nav-h">워크스페이스</p>
      <a href="#/" data-view="home">대시보드</a>
      <a href="#/news" data-view="news">무역 뉴스 <span class="count" id="nav-news"></span></a>
      <a href="#/sectors" data-view="sectors">섹터 분석</a>
      <a href="#/watch" data-view="watch">관심 섹터</a>

      <p class="nav-h">물류 도구</p>
      <a href="#/hs" data-view="hs">HS 코드 · 통관 계산</a>
      <span class="nav-off" title="실시간 연동이 필요해 MVP에서 제외">운임 조회 <em>준비 중</em></span>
      <span class="nav-off" title="실시간 연동이 필요해 MVP에서 제외">화물 추적 <em>준비 중</em></span>
    </nav>

    <form class="quick" id="quick">
      <label for="quick-q">HS 코드 빠른 검색</label>
      <input id="quick-q" type="search" placeholder="품목명 (예: 반도체)" autocomplete="off">
    </form>
  </aside>

  <div class="main">
    <header class="top">
      <button class="menu" id="menu" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="top-date" id="top-date"></div>
      <div class="top-badges">
        <span class="pill ai"><i></i>AI 요약 · 매일 <b id="upd"></b> 갱신</span>
        <span class="pill sample" id="sample-pill" hidden>샘플 데이터</span>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">뉴스 흐름을 AI가 정리한 참고자료이며 투자 권유가 아닙니다. 실제 판단은 원문과 함께 확인하신 뒤 직접 하시기 바랍니다.</footer>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
